<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142b23">
  <meta name="description" content="Make every set count. Private workout tracking, thoughtful progression, and a clearer picture of your training.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'">
  <title>Forma — Build with intention</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Forma home"><span class="brand-symbol" aria-hidden="true">f</span>forma<span class="brand-dot">.</span></a>
    <p class="sidebar-kicker">A LITTLE STRONGER, EVERY DAY.</p>
    <nav aria-label="Main navigation" id="navigation"></nav>
    <div class="sidebar-bottom">
      <div class="privacy-note"><span class="status-dot"></span><span>Your space. Your data.<small>Saved on this device</small></span></div>
      <button class="sidebar-settings" data-action="settings"><span aria-hidden="true">⚙</span> Settings & backups</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">YOUR TRAINING, IN FOCUS</div><div class="topbar-right"><span id="today-date"></span><button class="avatar" data-action="settings" aria-label="Open settings">F</button></div></header>
    <div id="notice" role="status"></div>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>Built for the long game.</span><button class="text-button" data-action="about">How Forma works <span aria-hidden="true">↗</span></button></footer>
  </div>
  <div id="timer" class="timer-container" aria-live="off"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">Forma needs JavaScript to log workouts. Enable it to use the app; your data stays in this browser.</div></noscript>
</body>
</html>
